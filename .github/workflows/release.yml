name: release

# Pushing a tag like v1.0.0 builds the frontend assets (npm doesn't run on the
# shared host) and publishes them as build.tar.gz on a GitHub Release.
# The deploy job then SSHes into Hostinger and runs deploy/deploy.sh for the tag.
# Required repo secrets: HOSTINGER_HOST, HOSTINGER_PORT, HOSTINGER_USER,
# HOSTINGER_SSH_KEY, HOSTINGER_KNOWN_HOSTS, HOSTINGER_APP_DIR (absolute path of the clone).

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      # Wayfinder generates TS route helpers via artisan during the Vite build,
      # so PHP + vendor + a throwaway .env are needed here.
      - name: Install PHP dependencies
        run: composer install --no-dev --no-interaction --prefer-dist

      - name: Prepare throwaway environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Install JS dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Package assets
        run: tar -czf "$RUNNER_TEMP/build.tar.gz" -C public build

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: ${{ github.workspace }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/build.tar.gz" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.HOSTINGER_KNOWN_HOSTS }}
          HOST: ${{ secrets.HOSTINGER_HOST }}
          PORT: ${{ secrets.HOSTINGER_PORT }}
          REMOTE_USER: ${{ secrets.HOSTINGER_USER }}
          APP_DIR: ${{ secrets.HOSTINGER_APP_DIR }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # Quote the remote command so tag and path are passed as plain arguments.
          ssh -i ~/.ssh/deploy_key -p "$PORT" -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              "$REMOTE_USER@$HOST" \
              "bash $(printf '%q' "$APP_DIR")/deploy/deploy.sh $(printf '%q' "$GITHUB_REF_NAME")"
